                uid: DS_PROMETHEUS
              editorMode: code
              expr: "time() - (domain_exporter_last_successful_collection_timestamp_seconds{job=~\"^(prometheus[_-])?domain[_-]exporter$\"} > 0)"
              instant: true
              intervalMs: 15000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
