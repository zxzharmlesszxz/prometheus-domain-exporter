                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: "$A > 7200"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: math
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Prometheus Domain Exporter collection is stale"
          description: "prometheus-domain-exporter has not refreshed domain data successfully for more than 2 hours."
        labels:
          severity: warning
          service: prometheus-domain-exporter
          rule_source: grafana
        isPaused: false
