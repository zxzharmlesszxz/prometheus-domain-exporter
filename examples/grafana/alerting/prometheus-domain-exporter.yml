apiVersion: 1

groups:
  - orgId: 1
    name: prometheus-domain-exporter
    folder: Exporters
    interval: 30s
    rules:
      - uid: pde-exporter-down
        title: domainExporterDown
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: DS_PROMETHEUS
            model:
              datasource:
                type: prometheus
                uid: DS_PROMETHEUS
              editorMode: code
              expr: "up{job=~\"^(prometheus[_-])?domain[_-]exporter$\"}"
              instant: true
              intervalMs: 15000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: "$A == 0"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: math
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Prometheus Domain Exporter is down"
          description: "Prometheus cannot scrape prometheus-domain-exporter."
        labels:
          severity: warning
          service: prometheus-domain-exporter
          rule_source: grafana
        isPaused: false
      - uid: pde-collection-failed
        title: domainExporterCollectionFailed
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: DS_PROMETHEUS
            model:
              datasource:
                type: prometheus
                uid: DS_PROMETHEUS
              editorMode: code
              expr: "domain_exporter_last_collection_success{job=~\"^(prometheus[_-])?domain[_-]exporter$\"}"
              instant: true
              intervalMs: 15000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: "$A == 0"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: math
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Prometheus Domain Exporter collection is failing"
          description: "prometheus-domain-exporter has not completed a successful collection for at least 10 minutes."
        labels:
          severity: warning
          service: prometheus-domain-exporter
          rule_source: grafana
        isPaused: false
      - uid: pde-collection-stale
        title: domainExporterCollectionStale
