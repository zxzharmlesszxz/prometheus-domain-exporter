rule_files:
  - ../prometheus-domain-exporter.yml

evaluation_interval: 1m

tests:
  - name: Exporter availability and collection health alerts honor hold times
    interval: 1m
    input_series:
      - series: 'up{job="domain-exporter",instance="exporter-down"}'
        values: '0x20'
      - series: 'domain_exporter_last_collection_success{job="domain-exporter",instance="collection-failed"}'
        values: '0x20'
      - series: 'domain_exporter_last_successful_collection_timestamp_seconds{job="domain-exporter",instance="collection-stale"}'
        values: '1x140'
    alert_rule_test:
      - eval_time: 6m
        alertname: domainExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: domain-exporter
              instance: exporter-down
            exp_annotations:
              summary: Prometheus Domain Exporter is down
              description: Prometheus cannot scrape prometheus-domain-exporter.
      - eval_time: 11m
        alertname: domainExporterCollectionFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: domain-exporter
              instance: collection-failed
            exp_annotations:
              summary: Prometheus Domain Exporter collection is failing
              description: prometheus-domain-exporter has not completed a successful collection for at least 10 minutes.
      - eval_time: 2h11m
        alertname: domainExporterCollectionStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: domain-exporter
              instance: collection-stale
            exp_annotations:
              summary: Prometheus Domain Exporter collection is stale
              description: prometheus-domain-exporter has not refreshed domain data successfully for more than 2 hours.

  - name: RDAP source alerts retain source labels
    interval: 1m
    input_series:
      - series: 'domain_rdap_up{job="domain-exporter",instance="source-down",source="rdap"}'
        values: '0x20'
      - series: 'domain_rdap_up{job="domain-exporter",instance="source-invalid",source="rdap"}'
        values: '1x20'
      - series: 'domain_rdap_valid{job="domain-exporter",instance="source-invalid",source="rdap"}'
        values: '0x20'
      - series: 'domain_rdap_read_errors_total{job="domain-exporter",instance="source-read",source="rdap"}'
        values: '0x14 1x16'
      - series: 'domain_rdap_parse_errors_total{job="domain-exporter",instance="source-parse",source="rdap"}'
        values: '0x14 1x16'
    alert_rule_test:
      - eval_time: 11m
        alertname: domainRDAPSourceDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: domain-exporter
              instance: source-down
              source: rdap
            exp_annotations:
              summary: Domain RDAP source is unavailable
              description: prometheus-domain-exporter cannot collect RDAP data on source-down.
      - eval_time: 11m
        alertname: domainRDAPSourceInvalid
        exp_alerts:
          - exp_labels:
              severity: warning
              job: domain-exporter
              instance: source-invalid
              source: rdap
            exp_annotations:
              summary: Domain RDAP source is readable but invalid
              description: prometheus-domain-exporter collected RDAP data on source-invalid, but one or more configured domains could not be interpreted successfully.
      - eval_time: 30m
        alertname: domainRDAPReadErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              job: domain-exporter
              instance: source-read
              source: rdap
            exp_annotations:
              summary: Domain RDAP read errors observed
              description: prometheus-domain-exporter observed one or more RDAP read/lookup errors in the last 30 minutes.
      - eval_time: 30m
        alertname: domainRDAPParseErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              job: domain-exporter
              instance: source-parse
              source: rdap
            exp_annotations:
              summary: Domain RDAP parse errors observed
              description: prometheus-domain-exporter observed one or more RDAP parse/validity errors in the last 30 minutes.

  - name: WHOIS source alerts retain source labels
    interval: 1m
    input_series:
      - series: 'domain_whois_up{job="domain-exporter",instance="source-down",source="whois"}'
        values: '0x20'
      - series: 'domain_whois_up{job="domain-exporter",instance="source-invalid",source="whois"}'
        values: '1x20'
      - series: 'domain_whois_valid{job="domain-exporter",instance="source-invalid",source="whois"}'
        values: '0x20'
      - series: 'domain_whois_read_errors_total{job="domain-exporter",instance="source-read",source="whois"}'
        values: '0x14 1x16'
      - series: 'domain_whois_parse_errors_total{job="domain-exporter",instance="source-parse",source="whois"}'
        values: '0x14 1x16'
    alert_rule_test:
      - eval_time: 11m
        alertname: domainWHOISSourceDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: domain-exporter
              instance: source-down
              source: whois
            exp_annotations:
              summary: Domain WHOIS source is unavailable
              description: prometheus-domain-exporter cannot collect WHOIS data on source-down.
      - eval_time: 11m
        alertname: domainWHOISSourceInvalid
        exp_alerts:
          - exp_labels:
              severity: warning
              job: domain-exporter
              instance: source-invalid
              source: whois
            exp_annotations:
              summary: Domain WHOIS source is readable but invalid
              description: prometheus-domain-exporter collected WHOIS data on source-invalid, but one or more configured domains could not be interpreted successfully.
      - eval_time: 30m
        alertname: domainWHOISReadErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              job: domain-exporter
              instance: source-read
              source: whois
            exp_annotations:
              summary: Domain WHOIS read errors observed
              description: prometheus-domain-exporter observed one or more WHOIS read/lookup errors in the last 30 minutes.
      - eval_time: 30m
        alertname: domainWHOISParseErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              job: domain-exporter
              instance: source-parse
              source: whois
            exp_annotations:
              summary: Domain WHOIS parse errors observed
              description: prometheus-domain-exporter observed one or more WHOIS parse/validity errors in the last 30 minutes.

  - name: Domain registration alerts retain domain labels and severities
    interval: 1m
    input_series:
      - series: 'domain_registration_lookup_success{job="domain-exporter",instance="exporter:9853",domain="failed.example"}'
        values: '0x40'
      - series: 'domain_registration_data_available{job="domain-exporter",instance="exporter:9853",domain="unavailable.example"}'
        values: '0x40'
      - series: 'domain_registration_data_stale{job="domain-exporter",instance="exporter:9853",domain="stale.example"}'
        values: '1x40'
      - series: 'domain_registration_expiration_remaining_seconds{job="domain-exporter",instance="exporter:9853",domain="warning.example"}'
        values: '2591999x40'
      - series: 'domain_registration_expiration_remaining_seconds{job="domain-exporter",instance="exporter:9853",domain="critical.example"}'
        values: '604799x40'
      - series: 'domain_registration_expiration_remaining_seconds{job="domain-exporter",instance="exporter:9853",domain="expired.example"}'
        values: '-1x40'
    alert_rule_test:
      - eval_time: 16m
        alertname: domainRegistrationLookupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: domain-exporter
              instance: exporter:9853
              domain: failed.example
            exp_annotations:
              summary: Domain registration lookup failed
              description: prometheus-domain-exporter cannot resolve registration expiration for failed.example.
      - eval_time: 16m
        alertname: domainRegistrationDataUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              job: domain-exporter
              instance: exporter:9853
              domain: unavailable.example
            exp_annotations:
              summary: Domain registration data is unavailable
              description: prometheus-domain-exporter has no confirmed registration expiration for unavailable.example.
      - eval_time: 16m
        alertname: domainRegistrationDataStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: domain-exporter
              instance: exporter:9853
              domain: stale.example
            exp_annotations:
              summary: Domain registration data is stale
              description: The last confirmed registration expiration for stale.example is at least 24 hours old.
      - eval_time: 31m
        alertname: domainRegistrationExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              job: domain-exporter
              instance: exporter:9853
              domain: warning.example
            exp_annotations:
              summary: Domain registration expires soon
              description: Domain warning.example registration expires in less than 30 days.
      - eval_time: 31m
        alertname: domainRegistrationExpiringIn7Days
        exp_alerts:
          - exp_labels:
              severity: critical
              job: domain-exporter
              instance: exporter:9853
              domain: critical.example
            exp_annotations:
              summary: Domain registration expiry is critical
              description: Domain critical.example registration expires in less than 7 days or has already expired.
          - exp_labels:
              severity: critical
              job: domain-exporter
              instance: exporter:9853
              domain: expired.example
            exp_annotations:
              summary: Domain registration expiry is critical
              description: Domain expired.example registration expires in less than 7 days or has already expired.

  - name: Lookup coverage alert handles missing lookup series without many-to-many matching
    interval: 1m
    input_series:
      - series: 'domain_exporter_configured_domains{job="domain-exporter",instance="missing-lookups"}'
        values: '2x20'
      - series: 'domain_registration_lookup_success{job="domain-exporter",instance="missing-lookups",domain="example.com"}'
        values: '1x20'
      - series: 'domain_exporter_configured_domains{job="domain-exporter",instance="no-lookups"}'
        values: '2x20'
      - series: 'domain_exporter_configured_domains{job="domain-exporter",instance="complete"}'
        values: '2x20'
      - series: 'domain_registration_lookup_success{job="domain-exporter",instance="complete",domain="example.com"}'
        values: '1x20'
      - series: 'domain_registration_lookup_success{job="domain-exporter",instance="complete",domain="example.net"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: domainRegistrationLookupIncomplete
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: missing-lookups
            exp_annotations:
              summary: Some domains not yet looked up
              description: 1 configured domain(s) have not reported registration lookup status.
          - exp_labels:
              severity: warning
              instance: no-lookups
            exp_annotations:
              summary: Some domains not yet looked up
              description: 2 configured domain(s) have not reported registration lookup status.
