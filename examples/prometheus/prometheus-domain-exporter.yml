groups:
  - name: prometheus-domain-exporter
    rules:
      - alert: domainExporterDown
        expr: up{job=~"^(prometheus[_-])?domain[_-]exporter$"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Prometheus Domain Exporter is down
          description: Prometheus cannot scrape prometheus-domain-exporter.

      - alert: domainExporterCollectionFailed
        expr: domain_exporter_last_collection_success{job=~"^(prometheus[_-])?domain[_-]exporter$"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Prometheus Domain Exporter collection is failing
          description: prometheus-domain-exporter has not completed a successful collection for at least 10 minutes.

      - alert: domainExporterCollectionStale
        expr: time() - (domain_exporter_last_successful_collection_timestamp_seconds{job=~"^(prometheus[_-])?domain[_-]exporter$"} > 0) > 7200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Prometheus Domain Exporter collection is stale
          description: prometheus-domain-exporter has not refreshed domain data successfully for more than 2 hours.

      - alert: domainRDAPSourceDown
        expr: domain_rdap_up{job=~"^(prometheus[_-])?domain[_-]exporter$"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Domain RDAP source is unavailable
          description: prometheus-domain-exporter cannot collect RDAP data on {{ $labels.instance }}.

      - alert: domainRDAPSourceInvalid
        expr: domain_rdap_up{job=~"^(prometheus[_-])?domain[_-]exporter$"} == 1 and domain_rdap_valid{job=~"^(prometheus[_-])?domain[_-]exporter$"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Domain RDAP source is readable but invalid
          description: prometheus-domain-exporter collected RDAP data on {{ $labels.instance }}, but one or more configured domains could not be interpreted successfully.

      - alert: domainRDAPReadErrors
        expr: increase(domain_rdap_read_errors_total{job=~"^(prometheus[_-])?domain[_-]exporter$"}[30m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Domain RDAP read errors observed
          description: prometheus-domain-exporter observed one or more RDAP read/lookup errors in the last 30 minutes.

      - alert: domainRDAPParseErrors
        expr: increase(domain_rdap_parse_errors_total{job=~"^(prometheus[_-])?domain[_-]exporter$"}[30m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Domain RDAP parse errors observed
          description: prometheus-domain-exporter observed one or more RDAP parse/validity errors in the last 30 minutes.

      - alert: domainRegistrationLookupFailed
        expr: domain_registration_lookup_success{job=~"^(prometheus[_-])?domain[_-]exporter$"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Domain registration lookup failed
          description: prometheus-domain-exporter cannot resolve registration expiration for {{ $labels.domain }}.

      - alert: domainRegistrationExpiringSoon
        expr: domain_registration_expiration_remaining_seconds{job=~"^(prometheus[_-])?domain[_-]exporter$"} < 30 * 24 * 60 * 60
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Domain registration expires soon
          description: Domain {{ $labels.domain }} registration expires in less than 30 days.

      - alert: domainRegistrationExpiringIn7Days
        expr: domain_registration_expiration_remaining_seconds{job=~"^(prometheus[_-])?domain[_-]exporter$"} < 7 * 24 * 60 * 60
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: Domain registration expiring in 7 days
          description: Domain {{ $labels.domain }} registration expires in less than 7 days.

      - alert: domainRegistrationLookupIncomplete
        expr: max by (instance) (domain_exporter_configured_domains{job=~"^(prometheus[_-])?domain[_-]exporter$"}) - (count by (instance) (domain_registration_lookup_success{job=~"^(prometheus[_-])?domain[_-]exporter$"}) or max by (instance) (domain_exporter_configured_domains{job=~"^(prometheus[_-])?domain[_-]exporter$"} * 0)) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Some domains not yet looked up
          description: '{{ $value | humanize }} configured domain(s) have not reported registration lookup status.'
