---

image: golang:1.27.0-alpine

before_script:
  - apk add --no-cache bash build-base ca-certificates git make

variables:
  PROJECT_NAME: "${CI_PROJECT_NAME}"
  DOCKER_PLATFORMS: "linux/amd64,linux/arm64"

.build-metadata: &build-metadata |
  export VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_REF_NAME:-dev}}"
  export BRANCH="${CI_COMMIT_BRANCH:-${CI_COMMIT_REF_NAME:-detached}}"
  export REVISION="${CI_COMMIT_SHORT_SHA:-${CI_COMMIT_SHA:-dev}}"
  export BUILD_USER="${GITLAB_USER_LOGIN:-gitlab-ci}"
  export BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

stages:
  - test
  - build
  - integration
  - release
  - publish

test:
  stage: test
  script:
    - *build-metadata
    - make go-check

compile:
  stage: build
  script:
    - *build-metadata
    - make build
  artifacts:
    name: "$PROJECT_NAME-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 1 week

docker-check:
  stage: integration
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - apk add --no-cache make
  script:
    - make examples-check
    - make docker-smoke SMOKE_DOCKER_IMAGE="$PROJECT_NAME:make-smoke"

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - *build-metadata
    - make release-smoke
  artifacts:
    name: "$PROJECT_NAME-$CI_COMMIT_TAG"
    paths:
      - dist/
    expire_in: 1 month

docker-publish:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache make
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker buildx create --use --name ci-builder || docker buildx use ci-builder
  script:
    - *build-metadata
    - make docker-buildx-push DOCKER_IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" DOCKER_PLATFORMS="$DOCKER_PLATFORMS"
