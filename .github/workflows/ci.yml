---

name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_PLATFORMS: "linux/amd64,linux/arm64"

permissions:
  contents: read

jobs:
  go-check:
    name: Go Check
    runs-on: ubuntu-24.04
    container:
      image: golang:1.27.0-alpine

    steps:
      - name: Prepare Alpine
        shell: sh
        run: apk add --no-cache bash build-base ca-certificates git make

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run Go Checks
        run: make go-check

  build:
    name: Build Binary
    runs-on: ubuntu-24.04
    container:
      image: golang:1.27.0-alpine
    needs:
      - go-check

    steps:
      - name: Prepare Alpine
        shell: sh
        run: apk add --no-cache bash ca-certificates git make

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build
        run: make build

  docker-check:
    name: Docker And Examples Check
    runs-on: ubuntu-24.04
    needs:
      - go-check

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Examples Check
        run: make examples-check

      - name: Docker Smoke
        run: make docker-smoke

  release:
    name: Release Artifacts
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag'
    needs:
      - go-check
      - build
      - docker-check
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'

      - name: Build Release Archives
        run: make release-smoke

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body: "Release ${{ github.ref_name }}"
          working_directory: dist
          files: |
            *.tar.gz
            checksums.txt

  docker-publish:
    name: Publish Docker Image
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag'
    needs:
      - go-check
      - build
      - docker-check
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker Build Metadata
        id: docker-meta
        shell: bash
        run: |
          revision="${GITHUB_SHA::7}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="$(make print-ldflags \
            VERSION="${GITHUB_REF_NAME}" \
            BRANCH="${GITHUB_REF_NAME}" \
            REVISION="${revision}" \
            BUILD_USER=github-actions \
            BUILD_DATE="${build_date}")"

          {
            echo "revision=${revision}"
            echo "build_date=${build_date}"
            echo "ldflags=${ldflags}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          build-args: |
            PROJECT_NAME=prometheus-domain-exporter
            LDFLAGS=${{ steps.docker-meta.outputs.ldflags }}
